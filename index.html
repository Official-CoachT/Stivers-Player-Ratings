<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Stivers Tigers · Player Ratings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --brown: #5C3A21;
    --brown-dark: #3D2614;
    --brown-light: #8A5A32;
    --orange: #E07A29;
    --orange-light: #F4A860;
    --gray: #666666;
    --gray-dark: #333333;
    --gray-light: #D4D4D4;
    --gray-xlight: #F5F5F5;
    --gray-bg: #EBEBEB;
    --white: #ffffff;
    --text: #1a1a1a;
    --border: #CCCCCC;
    --font-display: 'Oswald', -apple-system, sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  }
  body { font-family: var(--font-body); background: #2A1A10; color: var(--text); min-height: 100vh; }

  header { background: var(--brown); padding: 18px 20px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.4); border-bottom: 3px solid var(--orange); }
  header h1 { font-family: var(--font-display); color: var(--orange-light); font-size: 20px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  header p { font-family: var(--font-body); color: rgba(255,255,255,0.7); font-size: 12px; margin-top: 4px; letter-spacing: 0.02em; }

  .tabs { display: flex; background: var(--brown-dark); border-bottom: 3px solid var(--orange); }
  .tab { flex: 1; padding: 12px; text-align: center; color: rgba(255,255,255,0.55); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; border: none; background: none; letter-spacing: 0.04em; text-transform: uppercase; font-family: var(--font-body); }
  .tab.active { color: var(--orange-light); border-bottom: 3px solid var(--orange); background: rgba(224,122,41,0.12); }

  .view { display: none; padding: 16px; max-width: 600px; margin: 0 auto; }
  .view.active { display: block; }

  .leaderboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
  .lb-scene { perspective: 1000px; }
  .lb-flip { position: relative; aspect-ratio: 3/4; transition: transform 0.5s; transform-style: preserve-3d; cursor: pointer; }
  .lb-flip.flipped { transform: rotateY(180deg); }
  .lb-face { position: absolute; inset: 0; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; }
  .lb-face.unrated { opacity: 0.4; }
  .lb-front { clip-path: polygon(0% 9%, 50% 0%, 100% 9%, 100% 76%, 50% 100%, 0% 76%); padding: 20px 6px 24px; }
  .lb-front.tier-elite { background: linear-gradient(160deg, #3D2614 0%, #5C3A21 55%, #7A4E28 100%); }
  .lb-front.tier-excellent { background: linear-gradient(160deg, #6E4626 0%, #8A5A32 55%, #A9743F 100%); }
  .lb-front.tier-good { background: linear-gradient(160deg, #A9743F 0%, #C68A4A 55%, #D9A467 100%); }
  .lb-front.tier-average { background: linear-gradient(160deg, #B8B8B8 0%, #D4D4D4 55%, #E8E8E8 100%); }
  .lb-front.tier-developing { background: linear-gradient(160deg, #D8D8D8 0%, #ECECEC 55%, #F5F5F5 100%); }
  .lb-front.tier-elite .lb-ovr, .lb-front.tier-elite .lb-name, .lb-front.tier-excellent .lb-ovr, .lb-front.tier-excellent .lb-name, .lb-front.tier-good .lb-ovr, .lb-front.tier-good .lb-name { color: #fff; }
  .lb-front.tier-elite .lb-pos, .lb-front.tier-excellent .lb-pos, .lb-front.tier-good .lb-pos { color: rgba(255,255,255,0.75); }
  .lb-front.tier-average .lb-ovr, .lb-front.tier-average .lb-name, .lb-front.tier-developing .lb-ovr, .lb-front.tier-developing .lb-name { color: #3D2614; }
  .lb-front.tier-average .lb-pos, .lb-front.tier-developing .lb-pos { color: rgba(61,38,20,0.6); }
  .lb-ovr { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1; }
  .lb-pos { font-size: 11px; font-weight: 600; letter-spacing: 0.05em; margin-top: 3px; text-transform: uppercase; }
  .lb-avatar { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.2); border: 1.5px solid rgba(255,255,255,0.5); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; font-family: var(--font-display); position: relative; margin-top: 7px; }
  .lb-front.tier-average .lb-avatar, .lb-front.tier-developing .lb-avatar { background: rgba(61,38,20,0.1); border-color: rgba(61,38,20,0.35); color: #3D2614; }
  .lb-avatar .num { position: absolute; bottom: -4px; right: -4px; background: var(--orange); color: var(--brown-dark); font-size: 8px; font-weight: 700; border-radius: 50%; width: 15px; height: 15px; display: flex; align-items: center; justify-content: center; font-family: var(--font-body); }
  .lb-name { font-size: 13px; font-weight: 700; line-height: 1.15; text-align: center; margin-top: 5px; }
  .lb-team { font-size: 8px; letter-spacing: 0.12em; opacity: 0.65; text-transform: uppercase; font-weight: 600; }
  .lb-back { transform: rotateY(180deg); clip-path: polygon(0% 9%, 50% 0%, 100% 9%, 100% 76%, 50% 100%, 0% 76%); background: var(--brown); padding: 20px 8px 24px; justify-content: center; }
  .lb-back-ovr { font-family: var(--font-display); font-size: 17px; font-weight: 700; color: var(--orange-light); margin-bottom: 7px; }
  .lb-stat-list { display: flex; flex-direction: column; gap: 3px; width: 100%; }
  .lb-stat-row { display: flex; justify-content: space-between; font-size: 10.5px; color: white; padding: 0 8px; }
  .lb-stat-row b { color: var(--orange-light); font-family: var(--font-display); }

  .pw-wrap { background: white; border-radius: 14px; padding: 32px 24px; text-align: center; box-shadow: 0 2px 16px rgba(0,0,0,0.2); margin-top: 20px; border-top: 4px solid var(--orange); }
  .pw-wrap h2 { font-family: var(--font-display); color: var(--brown); font-size: 20px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.03em; }
  .pw-wrap p { color: #666; font-size: 14px; margin-bottom: 24px; }
  .pw-input { width: 100%; padding: 14px; font-size: 18px; text-align: center; border: 2px solid var(--border); border-radius: 10px; margin-bottom: 12px; letter-spacing: 0.15em; font-family: var(--font-body); }
  .pw-input:focus { outline: none; border-color: var(--orange); }
  .pw-btn { width: 100%; padding: 14px; background: var(--brown); color: var(--orange-light); font-size: 15px; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; letter-spacing: 0.04em; font-family: var(--font-body); }
  .pw-btn:active { background: var(--brown-dark); }
  .pw-error { color: #BB0000; font-size: 13px; margin-top: 10px; display: none; }

  .player-select { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .add-player-row { display: flex; gap: 6px; margin-bottom: 14px; }
  .add-name-input { flex: 2; min-width: 0; padding: 10px; border: 2px solid var(--border); border-radius: 8px; font-size: 13px; font-family: var(--font-body); }
  .add-name-input:focus { outline: none; border-color: var(--orange); }
  .add-pos-select { flex: 1; padding: 10px 4px; border: 2px solid var(--border); border-radius: 8px; font-size: 13px; font-family: var(--font-body); }
  .add-num-input { width: 44px; padding: 10px 4px; border: 2px solid var(--border); border-radius: 8px; font-size: 13px; text-align: center; font-family: var(--font-body); }
  .add-btn { padding: 10px 12px; background: var(--brown); color: var(--orange-light); border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; font-family: var(--font-body); }
  .add-btn:active { background: var(--brown-dark); }
  .player-btn { background: white; border: 2px solid var(--border); border-radius: 10px; padding: 10px 6px; text-align: center; font-size: 13px; font-weight: 600; color: var(--gray-dark); cursor: pointer; transition: all 0.15s; font-family: var(--font-body); }
  .player-btn:active { transform: scale(0.96); }
  .player-btn.rated { border-color: var(--orange); background: #FFFBEF; }
  .player-btn.selected { border-color: var(--brown); background: #F3E6D8; box-shadow: 0 2px 8px rgba(61,38,20,0.2); }
  .player-btn .mini-ovr { display: block; font-size: 11px; font-weight: 700; color: var(--brown); margin-top: 2px; font-family: var(--font-display); }

  .card-panel { background: white; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 16px rgba(0,0,0,0.15); border-top: 4px solid var(--orange); }
  .card-header { background: var(--brown); padding: 16px 18px; display: flex; align-items: center; gap: 12px; justify-content: space-between; }
  .card-avatar { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.08); border: 2px solid var(--orange); color: var(--orange-light); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; font-family: var(--font-display); flex-shrink: 0; }
  .card-name-wrap { flex: 1; }
  .name-input { font-family: var(--font-display); color: white; font-size: 18px; font-weight: 700; line-height: 1.2; background: transparent; border: none; border-bottom: 1px dashed rgba(255,255,255,0.4); width: 100%; padding: 2px 0; }
  .name-input:focus { outline: none; border-bottom-color: var(--orange-light); }
  .card-pos { color: var(--orange-light); font-size: 12px; letter-spacing: 0.05em; margin-top: 3px; }
  .edit-row { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
  .edit-row span { color: var(--orange-light); font-size: 12px; }
  .pos-select { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); border-radius: 5px; color: white; font-size: 12px; font-family: var(--font-body); padding: 3px 6px; }
  .pos-select:focus { outline: none; border-color: var(--orange-light); }
  .year-select { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); border-radius: 5px; color: white; font-size: 12px; font-family: var(--font-body); padding: 3px 6px; }
  .year-select:focus { outline: none; border-color: var(--orange-light); }
  .num-input { width: 40px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); border-radius: 5px; color: white; font-size: 12px; font-family: var(--font-body); padding: 3px 4px; text-align: center; }
  .num-input:focus { outline: none; border-color: var(--orange-light); }
  .card-ovr-box { text-align: center; background: rgba(224,122,41,0.15); border-radius: 10px; padding: 8px 14px; min-width: 72px; border: 1px solid var(--orange); }
  .card-ovr-num { font-family: var(--font-display); color: var(--orange-light); font-size: 28px; font-weight: 700; line-height: 1; }
  .card-ovr-label { color: rgba(255,255,255,0.7); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
  .attr-grid { display: grid; grid-template-columns: 1fr 1fr; }
  .attr-row { padding: 14px 18px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); }
  .attr-row:nth-child(even) { border-right: none; }
  .attr-row:nth-last-child(-n+2) { border-bottom: none; }
  .attr-row.full-width { grid-column: 1 / -1; border-right: none; }
  .attr-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gray); margin-bottom: 6px; }
  .attr-label.awareness { color: var(--brown); }
  .attr-sublabel { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--gray); font-size: 10px; }
  .blend-row { font-size: 12px; color: var(--brown); font-weight: 600; margin-top: 8px; }
  .cat-accordion { display: flex; flex-direction: column; }
  .cat-section { border-bottom: 1px solid var(--border); }
  .cat-header { display: flex; align-items: center; padding: 14px 18px; cursor: pointer; }
  .cat-name { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gray-dark); }
  .cat-value { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--brown); margin-left: auto; margin-right: 12px; }
  .cat-chevron { font-size: 11px; color: var(--gray); transition: transform 0.2s; display: inline-block; }
  .cat-subs { padding: 2px 18px 16px; }
  .sub-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
  .sub-label { width: 108px; flex-shrink: 0; font-size: 12px; color: var(--gray-dark); }
  .sub-slider { flex: 1; -webkit-appearance: none; appearance: none; height: 4px; background: var(--gray-bg); border-radius: 99px; outline: none; }
  .sub-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--brown); cursor: pointer; border: 2px solid var(--orange-light); }
  .sub-slider::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--brown); cursor: pointer; border: 2px solid var(--orange-light); }
  .sub-val { width: 26px; text-align: right; font-family: var(--font-display); font-size: 13px; font-weight: 700; color: var(--brown); flex-shrink: 0; }
  .blend-row strong { font-family: var(--font-display); font-size: 15px; }
  .attr-input-row { display: flex; align-items: center; gap: 8px; }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .step-btn { width: 26px; height: 26px; border-radius: 6px; border: 2px solid var(--border); background: var(--gray-xlight); font-size: 15px; font-weight: 700; color: var(--brown); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .step-btn:active { background: var(--orange-light); }
  .attr-val { font-family: var(--font-display); width: 40px; font-size: 20px; font-weight: 700; color: var(--brown); text-align: center; }
  .attr-bar-wrap { flex: 1; height: 8px; background: var(--gray-bg); border-radius: 99px; overflow: hidden; }
  .attr-bar { height: 100%; border-radius: 99px; background: var(--gray-light); transition: width 0.3s, background 0.3s; }
  .attr-bar.high { background: var(--brown); }
  .attr-bar.good { background: var(--brown-light); }
  .attr-bar.avg { background: #C68A4A; }
  .attr-bar.awareness-bar { background: var(--orange); }
  .quiz-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .entry-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .entry-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--gray-xlight); border: 1px solid var(--border); border-radius: 99px; padding: 3px 4px 3px 9px; font-size: 11px; color: var(--gray-dark); }
  .entry-del { width: 16px; height: 16px; border-radius: 50%; border: none; background: var(--border); color: white; font-size: 11px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .entry-del:active { background: #B23A2E; }
  .quiz-meta { font-size: 11px; color: var(--gray); flex: 1; }
  .quiz-input { width: 56px; padding: 6px; font-size: 13px; text-align: center; border: 2px solid var(--border); border-radius: 6px; }
  .quiz-input:focus { outline: none; border-color: var(--orange); }
  .quiz-log-btn { padding: 6px 12px; background: var(--brown); color: var(--orange-light); border: none; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .quiz-log-btn:active { background: var(--brown-dark); }

  .save-btn { width: calc(100% - 36px); margin: 16px 18px; padding: 14px; background: var(--brown); color: var(--orange-light); font-size: 15px; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; letter-spacing: 0.04em; transition: background 0.2s; font-family: var(--font-body); }
  .save-btn:active { background: var(--brown-dark); }
  .save-btn:disabled { background: #aaa; cursor: not-allowed; }
  .remove-btn { width: calc(100% - 36px); margin: 0 18px 16px; padding: 11px; background: transparent; color: #B23A2E; border: 1.5px solid #B23A2E; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--font-body); }
  .remove-btn:active { background: rgba(178,58,46,0.1); }

  .modal-name { font-family: var(--font-display); color: white; font-size: 18px; font-weight: 700; line-height: 1.2; }


  .saved-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--brown); color: var(--orange-light); padding: 12px 24px; border-radius: 99px; font-size: 14px; font-weight: 600; transition: transform 0.3s; z-index: 999; white-space: nowrap; border: 2px solid var(--orange); }
  .saved-toast.show { transform: translateX(-50%) translateY(0); }

  .scale-bar { display: flex; gap: 4px; padding: 12px 0 0; }
  .scale-item { flex: 1; border-radius: 6px; padding: 6px 4px; text-align: center; }
  .scale-item .sr { font-family: var(--font-display); font-size: 11px; font-weight: 700; } .scale-item .sl { font-size: 9px; margin-top: 1px; }
  .loading { text-align: center; color: rgba(255,255,255,0.6); padding: 32px; font-size: 14px; }
</style>
</head>
<body>

<header>
  <h1>Stivers Tigers</h1>
  <p>Varsity Soccer · Player Ratings · 2026 Season</p>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('leaderboard',event)">Leaderboard</button>
  <button class="tab" onclick="switchTab('rate',event)">Rate Players</button>
</div>

<div id="view-leaderboard" class="view active">
  <div class="leaderboard-grid" id="lb-grid"><div class="loading">Loading ratings...</div></div>
  <div class="scale-bar">
    <div class="scale-item" style="background:var(--brown);color:white;"><div class="sr">90+</div><div class="sl">Elite</div></div>
    <div class="scale-item" style="background:var(--brown-light);color:white;"><div class="sr">80–89</div><div class="sl">Excellent</div></div>
    <div class="scale-item" style="background:#C68A4A;color:white;"><div class="sr">70–79</div><div class="sl">Good</div></div>
    <div class="scale-item" style="background:#D4D4D4;color:#333;"><div class="sr">60–69</div><div class="sl">Average</div></div>
    <div class="scale-item" style="background:#f0f0f0;color:#666;"><div class="sr">&lt;60</div><div class="sl">Developing</div></div>
  </div>
  <div style="height:20px"></div>
</div>

<div id="view-rate" class="view">
  <div id="pw-gate">
    <div class="pw-wrap">
      <h2>Coach Access</h2>
      <p>Enter the coach password to rate players</p>
      <input class="pw-input" type="password" id="pw-input" placeholder="••••••••" onkeydown="if(event.key==='Enter')checkPW()">
      <button class="pw-btn" onclick="checkPW()">UNLOCK</button>
      <div class="pw-error" id="pw-error">Incorrect password. Try again.</div>
    </div>
  </div>
  <div id="rate-interface" style="display:none;">
    <div class="add-player-row">
      <input type="text" id="new-player-name" placeholder="New player name" class="add-name-input">
      <select id="new-player-pos" class="add-pos-select"></select>
      <select id="new-player-year" class="add-pos-select"></select>
      <input type="number" id="new-player-num" placeholder="#" class="add-num-input" min="0" max="99">
      <button type="button" class="add-btn" onclick="addPlayer()">+ Add</button>
    </div>
    <div class="player-select" id="player-select"></div>
    <div class="card-panel" id="card-panel" style="display:none;">
      <div class="card-header">
        <div class="card-avatar" id="card-avatar">—</div>
        <div class="card-name-wrap">
          <input class="name-input" id="name-input" oninput="onNameEdit()">
          <div class="edit-row">
            <select class="pos-select" id="pos-select" onchange="onPosEdit()"></select>
            <select class="year-select" id="year-select" onchange="onYearEdit()"></select>
            <span>#</span>
            <input type="number" class="num-input" id="num-input" min="0" max="99" oninput="onNumEdit()">
          </div>
        </div>
        <div class="card-ovr-box">
          <div class="card-ovr-num" id="card-ovr">—</div>
          <div class="card-ovr-label">OVR</div>
        </div>
      </div>
      <div class="attr-grid" id="attr-grid"></div>
      <button class="save-btn" id="save-btn" onclick="saveRatings()">SAVE RATINGS</button>
      <button class="remove-btn" onclick="removePlayer()">Remove Player From Roster</button>
    </div>
    <div style="height:20px"></div>
  </div>
</div>

<div class="saved-toast" id="toast">✓ Ratings saved!</div>

<script>

// Goalkeepers get a completely different stat set — none of the outfield
// categories map cleanly to keeper skills. Pure manual steppers, no
// quiz/sprint/Tiger Eye blending (unlike Pace/Physical/Awareness above).
const GK_ATTRS=["Diving","Handling","Kicking","Reflexes","Speed","Positioning"];

// Each outfield category (except Awareness) is a computed average of these
// sub-attributes, rated individually via sliders. Awareness has no sub-attrs —
// it stays a single directly-rated stat blended with quiz scores as before.
const CATEGORY_SUBATTRS={
  Pace:["Acceleration","Sprint Speed"],
  Shooting:["Attacking Position","Finishing","Shot Power","Long Shots","Volleys","Penalties"],
  Passing:["Vision","Crossing","FK Accuracy","Short Pass","Long Pass","Curve"],
  Dribbling:["Agility","Balance","Reactions","Ball Control","Dribbling","Composure"],
  Defending:["Interceptions","Heading Accuracy","Def. Awareness","Standing Tackle","Slide Tackle"],
  Physical:["Jumping","Stamina","Strength","Aggression"]
};
const SUBATTR_KEY={
  "Acceleration":"acceleration","Sprint Speed":"sprint_speed",
  "Attacking Position":"attacking_position","Finishing":"finishing","Shot Power":"shot_power","Long Shots":"long_shots","Volleys":"volleys","Penalties":"penalties",
  "Vision":"vision","Crossing":"crossing","FK Accuracy":"fk_accuracy","Short Pass":"short_pass","Long Pass":"long_pass","Curve":"curve",
  "Agility":"agility","Balance":"balance","Reactions":"reactions","Ball Control":"ball_control","Dribbling":"dribbling_skill","Composure":"composure",
  "Interceptions":"interceptions","Heading Accuracy":"heading_accuracy","Def. Awareness":"def_awareness","Standing Tackle":"standing_tackle","Slide Tackle":"slide_tackle",
  "Jumping":"jumping","Stamina":"stamina","Strength":"strength","Aggression":"aggression"
};

// Position-specific weighting toward OVR — must sum to 1.0 per position
const POSITION_WEIGHTS={
  GK:  {pace:0.05,shooting:0.00,passing:0.15,dribbling:0.05,defending:0.30,physical:0.20,awareness:0.25},
  CB:  {pace:0.10,shooting:0.02,passing:0.13,dribbling:0.05,defending:0.35,physical:0.20,awareness:0.15},
  FB:  {pace:0.20,shooting:0.03,passing:0.15,dribbling:0.12,defending:0.25,physical:0.10,awareness:0.15},
  CDM: {pace:0.10,shooting:0.05,passing:0.20,dribbling:0.10,defending:0.25,physical:0.15,awareness:0.15},
  CM:  {pace:0.10,shooting:0.10,passing:0.25,dribbling:0.15,defending:0.10,physical:0.10,awareness:0.20},
  CAM: {pace:0.10,shooting:0.15,passing:0.20,dribbling:0.20,defending:0.05,physical:0.10,awareness:0.20},
  LM:  {pace:0.20,shooting:0.10,passing:0.15,dribbling:0.20,defending:0.10,physical:0.10,awareness:0.15},

function seedPlayer(id){ return INITIAL_SEED.find(p=>p.id===id); }
function displayName(id){ return (db[id]&&db[id].display_name)||(seedPlayer(id)&&seedPlayer(id).name)||'Unnamed'; }
function playerPos(id){ return (db[id]&&db[id].position)||(seedPlayer(id)&&seedPlayer(id).pos)||'CM'; }
function playerNum(id){ const n=db[id]&&db[id].jersey_num; return (n!==undefined&&n!==null)?n:((seedPlayer(id)&&seedPlayer(id).num)??'-'); }
function playerYear(id){ return (db[id]&&db[id].year)||'FR'; }

// Tiger Eye is logged as m:ss (e.g. "4:32") since it's a multi-round circuit
// that runs several minutes — parsed to total seconds for storage/scoring,
// displayed back as m:ss so it stays readable.
function parseMMSS(str){
  str=(str||'').trim();
  if(str.includes(':')){
    const [m,s]=str.split(':');
    return (parseInt(m)||0)*60+(parseFloat(s)||0);
  }
  return parseFloat(str)||0;
}
function formatMMSS(totalSeconds){
  const m=Math.floor(totalSeconds/60);
  const s=Math.round((totalSeconds-m*60)*10)/10;
  const sPadded=s<10?'0'+s:''+s;
  return `${m}:${sPadded}`;
}

// Averages whichever inputs actually exist yet (ignores missing ones).
function blendValues(vals){
  const present=vals.filter(v=>v!=null);
  if(present.length===0) return null;
  return Math.round(present.reduce((a,b)=>a+b,0)/present.length);
}

// Blends your own manual awareness judgment with the logged quiz average.
function effectiveAwareness(id){
  return blendValues([db[id]&&db[id].awareness, quizAvg(id)]);
}

// Sprint times scored relative to the whole team's own fastest/slowest logged
// time (fastest = 99, slowest = a 50 floor), using each player's personal best.
function teamSprintRange(){
  let all=[];
  Object.values(sprintTimes).forEach(arr=>{all=all.concat(arr.map(e=>e.value));});
  if(all.length===0) return null;
  return {min:Math.min(...all),max:Math.max(...all)};
}
function sprintScore(id){
  const list=sprintTimes[id];
  if(!list||list.length===0) return null;
  const best=Math.min(...list.map(e=>e.value));
  const range=teamSprintRange();
  if(!range||range.max===range.min) return 99;
  const score=99-((best-range.min)/(range.max-range.min))*49;
  return Math.round(Math.max(50,Math.min(99,score)));
}

// Man U Test: reps out of 20, scaled so 20/20 = 99 and 15/20 (the stated goal)
// lands around 74 — solidly "Good," not automatically elite.
function manuScore(id){
  const list=manuScores[id];
  if(!list||list.length===0) return null;
  const best=Math.max(...list.map(e=>e.value));
  return Math.min(99,Math.round((best/20)*99));
}

// Tiger Eye: 4 rounds of squats/burpees/pushups + a sideline-to-sideline sprint,
// timed. A conditioning/strength-endurance circuit, so it feeds Physical's
// Jumping/Stamina/Strength sub-attributes, not Pace. Scored against a fixed
// benchmark: the varsity standard (9:30) lands at the Average/Good line, and
// score moves ~1 point per 6 seconds faster or slower, capped 30-99.
const TIGER_EYE_STANDARD_SECONDS=570; // 9:30
const TIGER_EYE_STANDARD_SCORE=67;
const TIGER_EYE_SECONDS_PER_POINT=6;
function tigerEyeScore(id){
  const list=tigerEyeTimes[id];
  if(!list||list.length===0) return null;
  const best=Math.min(...list.map(e=>e.value));
  const diff=TIGER_EYE_STANDARD_SECONDS-best; // positive = faster than standard
  const score=TIGER_EYE_STANDARD_SCORE+(diff/TIGER_EYE_SECONDS_PER_POINT);
  return Math.round(Math.max(30,Math.min(99,score)));
}

// Effective value for one sub-attribute: blends manual + objective data for
// the few sub-attrs that have a data source, otherwise just the manual read.
function subAttrValue(id,subName){
  const key=SUBATTR_KEY[subName];
  const manual=db[id]&&db[id][key];
  if(subName==='Sprint Speed') return blendValues([manual, sprintScore(id), manuScore(id)]);
  if(subName==='Jumping'||subName==='Stamina'||subName==='Strength') return blendValues([manual, tigerEyeScore(id)]);
  return manual!=null?manual:null;
}

// A category's value is the average of whichever of its sub-attributes have
// been rated so far (same forgiving "use what exists" pattern as elsewhere).
function categoryValue(id,category){
  if(category==='Awareness') return effectiveAwareness(id);
  const subs=CATEGORY_SUBATTRS[category];
  if(!subs) return null;
  return blendValues(subs.map(s=>subAttrValue(id,s)));
}

function calcOVR(id){
  const r=db[id];
  if(!r) return null;
  const bonus=YEAR_BONUS[playerYear(id)]||0;
  if(playerPos(id)==='GK'){
    const vals=[r.diving,r.handling,r.kicking,r.reflexes,r.speed,r.positioning];
    if(vals.some(v=>!v)) return null;
    const reflexesBoosted=Math.min(99,r.reflexes+bonus);
    const positioningBoosted=Math.min(99,r.positioning+bonus);
    return Math.round((r.diving+r.handling+r.kicking+reflexesBoosted+r.speed+positioningBoosted)/6);
  }
  const w=POSITION_WEIGHTS[playerPos(id)];
  const pace=categoryValue(id,'Pace');
  const shooting=categoryValue(id,'Shooting');
  const passing=categoryValue(id,'Passing');
  const dribbling=categoryValue(id,'Dribbling');
  const defending=categoryValue(id,'Defending');
  const physical=categoryValue(id,'Physical');
  const awareness=categoryValue(id,'Awareness');
  const vals=[pace,shooting,passing,dribbling,defending,physical,awareness];
  if(vals.some(v=>v==null)) return null;
  const physicalBoosted=Math.min(99,physical+bonus);
  const awarenessBoosted=Math.min(99,awareness+bonus);
  return Math.round(pace*w.pace+shooting*w.shooting+passing*w.passing+dribbling*w.dribbling+defending*w.defending+physicalBoosted*w.physical+awarenessBoosted*w.awareness);
}

function ovrClass(v){if(v===null)return'dev';if(v>=90)return'high';if(v>=80)return'good';if(v>=70)return'avg';return'dev';}
function tierClass(v){if(v===null)return'tier-developing';if(v>=90)return'tier-elite';if(v>=80)return'tier-excellent';if(v>=70)return'tier-good';if(v>=60)return'tier-average';return'tier-developing';}

const ATTR_ABBR={Pace:'PAC',Shooting:'SHO',Passing:'PAS',Dribbling:'DRI',Defending:'DEF',Physical:'PHY',Awareness:'AWA',Diving:'DIV',Handling:'HAN',Kicking:'KIC',Reflexes:'REF',Speed:'SPD',Positioning:'POS'};
function statValue(id,attr){
  if(CATEGORY_SUBATTRS[attr]||attr==='Awareness') return categoryValue(id,attr);
  const r=db[id]||{};
  return r[attr.toLowerCase()];
}

function buildLeaderboard(){
  const grid=document.getElementById('lb-grid');
  const ranked=roster.map(id=>({id,ovr:calcOVR(id)})).sort((a,b)=>{
    if(a.ovr===null&&b.ovr===null)return 0;
    if(a.ovr===null)return 1;if(b.ovr===null)return -1;return b.ovr-a.ovr;
  });
  grid.innerHTML='';
  ranked.forEach((p)=>{
    const name=displayName(p.id);
    const activeAttrs=playerPos(p.id)==='GK'?GK_ATTRS:ATTRS;
    const statRows=activeAttrs.map(a=>{
      const v=statValue(p.id,a);
      return `<div class="lb-stat-row"><span>${ATTR_ABBR[a]}</span><b>${v!=null?v:'—'}</b></div>`;
    }).join('');
    const scene=document.createElement('div');
    scene.className='lb-scene';
    scene.innerHTML=`
      <div class="lb-flip" onclick="this.classList.toggle('flipped')">
        <div class="lb-face lb-front ${tierClass(p.ovr)}${p.ovr===null?' unrated':''}">
          <div class="lb-ovr">${p.ovr!==null?p.ovr:'—'}</div>
          <div class="lb-pos">${playerPos(p.id)} · ${playerYear(p.id)}</div>
          <div class="lb-avatar">${initials(name)}<span class="num">${playerNum(p.id)}</span></div>
          <div class="lb-name">${name}</div>
          <div class="lb-team">Stivers</div>
        </div>
        <div class="lb-face lb-back">
          <div class="lb-back-ovr">${p.ovr!==null?p.ovr:'—'} OVR</div>
          <div class="lb-stat-list">${statRows}</div>
        </div>
      </div>`;
    grid.appendChild(scene);
  });
}

function checkPW(){
  const v=document.getElementById('pw-input').value;
  if(v===COACH_PW){unlocked=true;document.getElementById('pw-gate').style.display='none';document.getElementById('rate-interface').style.display='block';buildPlayerSelect();}
  else{document.getElementById('pw-error').style.display='block';document.getElementById('pw-input').value='';}
}

function buildPlayerSelect(){
  const addPos=document.getElementById('new-player-pos');
  if(addPos.options.length===0){
    addPos.innerHTML=Object.keys(POSITION_WEIGHTS).map(pos=>`<option value="${pos}">${pos}</option>`).join('');
  }
  const addYear=document.getElementById('new-player-year');
  if(addYear.options.length===0){
    addYear.innerHTML=YEARS.map(y=>`<option value="${y}">${y}</option>`).join('');
  }
  const wrap=document.getElementById('player-select');
  wrap.innerHTML='';
  roster.forEach(id=>{
    const ovr=calcOVR(id);
    const btn=document.createElement('button');
    btn.className='player-btn'+(ovr!==null?' rated':'')+(sel===id?' selected':'');
    btn.innerHTML=`${displayName(id)}<span class="mini-ovr">${ovr!==null?ovr:'—'}</span>`;
    btn.onclick=()=>selectPlayer(id);
    wrap.appendChild(btn);
  });
}

async function addPlayer(){
  const nameInput=document.getElementById('new-player-name');
  const posInput=document.getElementById('new-player-pos');
  const yearInput=document.getElementById('new-player-year');
  const numInput=document.getElementById('new-player-num');
  const name=nameInput.value.trim();
  if(!name) return;
  let id=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')||'player';
  let n=1;
  while(db[id]){ id=id+'-'+n; n++; }
  const pos=posInput.value||'CM';
  const year=yearInput.value||'FR';
  const num=parseInt(numInput.value)||0;
  db[id]={display_name:name,position:pos,year,jersey_num:num};
  roster.push(id);
  await dbUpsert(id,{display_name:name,position:pos,year,jersey_num:num});
  nameInput.value='';numInput.value='';
  buildPlayerSelect();
  buildLeaderboard();
}

async function removePlayer(){
  if(!sel) return;
  if(!confirm(`Remove ${displayName(sel)} from the roster? This deletes their saved ratings and quiz history too.`)) return;
  await fetch(`${SB_URL}/rest/v1/${TABLE}?id=eq.${encodeURIComponent(sel)}`,{method:"DELETE",headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`}});
  delete db[sel];
  delete quizScores[sel];
  roster=roster.filter(id=>id!==sel);
  sel=null;
  document.getElementById('card-panel').style.display='none';
  buildPlayerSelect();
  buildLeaderboard();
}

function selectPlayer(id){
  sel=id;buildPlayerSelect();
  document.getElementById('card-panel').style.display='block';
  document.getElementById('card-avatar').textContent=initials(displayName(id));
  document.getElementById('name-input').value=displayName(id);
  const posSelect=document.getElementById('pos-select');
  posSelect.innerHTML=Object.keys(POSITION_WEIGHTS).map(pos=>`<option value="${pos}">${pos}</option>`).join('');
  posSelect.value=playerPos(id);
  const yearSelect=document.getElementById('year-select');
  yearSelect.innerHTML=YEARS.map(y=>`<option value="${y}">${y}</option>`).join('');
  yearSelect.value=playerYear(id);
  document.getElementById('num-input').value=playerNum(id);
  const grid=document.getElementById('attr-grid');
  grid.innerHTML='';
  const r=db[id]||{};
  const isGK=playerPos(id)==='GK';

  if(isGK){
    GK_ATTRS.forEach((attr)=>{
      const key=attr.toLowerCase();
      const val=r[key]||50;
      const pct=val/99*100;
      const barClass=val>=90?'attr-bar high':val>=80?'attr-bar good':'attr-bar avg';
      const div=document.createElement('div');
      div.className='attr-row';
      div.innerHTML=`
        <div class="attr-label">${attr}</div>
        <div class="attr-input-row">
          <div class="stepper">
            <button type="button" class="step-btn" onclick="stepAttr('${attr}',-1)">−</button>
            <div class="attr-val" id="val-${attr}">${val}</div>
            <button type="button" class="step-btn" onclick="stepAttr('${attr}',1)">+</button>
          </div>
          <div class="attr-bar-wrap"><div class="${barClass}" id="bar-${attr}" style="width:${pct}%"></div></div>
        </div>`;
      grid.appendChild(div);
    });
    updateOVR();
    return;
  }

  // Outfield: 6 collapsible category sections (computed from sub-attribute
  // sliders), then Awareness as its own single directly-rated stat.
  const accordion=document.createElement('div');
  accordion.className='cat-accordion';
  ["Pace","Shooting","Passing","Dribbling","Defending","Physical"].forEach(cat=>{
    accordion.innerHTML+=categoryAccordionHTML(id,cat);
  });
  grid.appendChild(accordion);

  const awarenessVal=r.awareness||50;
  const awarenessPct=awarenessVal/99*100;
  const awarenessDiv=document.createElement('div');
  awarenessDiv.className='attr-row full-width';
  awarenessDiv.innerHTML=`
    <div class="attr-label awareness">Awareness <span class="attr-sublabel">(your read)</span></div>
    <div class="attr-input-row">
      <div class="stepper">
        <button type="button" class="step-btn" onclick="stepAttr('Awareness',-1)">−</button>
        <div class="attr-val" id="val-Awareness">${awarenessVal}</div>
        <button type="button" class="step-btn" onclick="stepAttr('Awareness',1)">+</button>
      </div>
      <div class="attr-bar-wrap"><div class="attr-bar awareness-bar" id="bar-Awareness" style="width:${awarenessPct}%"></div></div>
    </div>
    <div class="quiz-row">
      <span class="quiz-meta" id="quiz-meta">${(()=>{const avg=quizAvg(id);return avg!==null?`Quiz avg: ${avg} (${quizScores[id].length} logged)`:'No quizzes logged yet';})()}</span>
      <input type="number" min="1" max="99" class="quiz-input" id="quiz-input" placeholder="score">
      <button type="button" class="quiz-log-btn" onclick="logQuizScore('${id}')">Log</button>
    </div>
    <div class="entry-list" id="quiz-entries"></div>
    <div class="blend-row">Blended for OVR: <strong id="blend-val">${effectiveAwareness(id)??'—'}</strong></div>`;
  grid.appendChild(awarenessDiv);

  renderEntries('quiz-entries',quizScores[id],v=>v,'deleteQuizEntry',id);
  renderEntries('sprint-entries',sprintTimes[id],v=>`${v}s`,'deleteSprintEntry',id);
  renderEntries('manu-entries',manuScores[id],v=>`${v}/20`,'deleteManuEntry',id);
  renderEntries('tigereye-entries',tigerEyeTimes[id],v=>formatMMSS(v),'deleteTigerEyeEntry',id);
  updateOVR();
}

// Builds one collapsible category section: header (name + computed value)
// plus a slider per sub-attribute. Pace and Physical also get their
// existing log-entry blocks (sprint/Man U, Tiger Eye) appended once.
function categoryAccordionHTML(id,cat){
  const subs=CATEGORY_SUBATTRS[cat];
  const catVal=categoryValue(id,cat);
  const subRows=subs.map(subName=>{
    const key=SUBATTR_KEY[subName];
    const manual=(db[id]&&db[id][key]!=null)?db[id][key]:50;
    return `<div class="sub-row">
      <div class="sub-label">${subName}</div>
      <input type="range" min="1" max="99" value="${manual}" class="sub-slider" oninput="onSubSlide('${id}','${cat}','${subName}',this.value)">
      <div class="sub-val" id="subval-${key}">${manual}</div>
    </div>`;
  }).join('');
  let extraLog='';
  if(cat==='Pace'){
    extraLog=`<div class="quiz-row">
      <span class="quiz-meta" id="sprint-meta">${(()=>{const list=sprintTimes[id];return list&&list.length?`Best: ${Math.min(...list.map(e=>e.value))}s (${list.length} logged)`:'No times logged yet';})()}</span>
      <input type="number" step="0.01" min="0" class="quiz-input" id="sprint-input" placeholder="secs">
      <button type="button" class="quiz-log-btn" onclick="logSprintTime('${id}')">Log</button>
    </div>
    <div class="entry-list" id="sprint-entries"></div>
    <div class="quiz-row">
      <span class="quiz-meta" id="manu-meta">${(()=>{const list=manuScores[id];return list&&list.length?`Best: ${Math.max(...list.map(e=>e.value))}/20 (${list.length} logged)`:'No attempts logged yet';})()}</span>
      <input type="number" min="0" max="20" class="quiz-input" id="manu-input" placeholder="/20">
      <button type="button" class="quiz-log-btn" onclick="logManU('${id}')">Log</button>
    </div>
    <div class="entry-list" id="manu-entries"></div>
    <div class="blend-row">Sprint Speed blended: <strong id="pace-blend-val">${subAttrValue(id,'Sprint Speed')??'—'}</strong></div>`;
  }
  if(cat==='Physical'){
    extraLog=`<div class="quiz-row">
      <span class="quiz-meta" id="tigereye-meta">${(()=>{const list=tigerEyeTimes[id];return list&&list.length?`Best: ${formatMMSS(Math.min(...list.map(e=>e.value)))} (${list.length} logged)`:'No times logged yet';})()}</span>
      <input type="text" inputmode="numeric" class="quiz-input" id="tigereye-input" placeholder="m:ss">
      <button type="button" class="quiz-log-btn" onclick="logTigerEye('${id}')">Log</button>
    </div>
    <div class="entry-list" id="tigereye-entries"></div>
    <div class="blend-row">Tiger Eye contribution: <strong id="physical-blend-val">${tigerEyeScore(id)??'—'}</strong> <span class="attr-sublabel">(feeds Jumping / Stamina / Strength)</span></div>`;
  }
  return `<div class="cat-section">
    <div class="cat-header" onclick="toggleCategory('${cat}')">
      <span class="cat-name">${cat}</span>
      <span class="cat-value" id="catval-${cat}">${catVal??'—'}</span>
      <span class="cat-chevron" id="chev-${cat}">▾</span>
    </div>
    <div class="cat-subs" id="subs-${cat}" style="display:none;">
      ${subRows}
      ${extraLog}
    </div>
  </div>`;
}

function toggleCategory(cat){
  const panel=document.getElementById('subs-'+cat);
  const chev=document.getElementById('chev-'+cat);
  const isOpen=panel.style.display==='block';
  panel.style.display=isOpen?'none':'block';
  chev.style.transform=isOpen?'rotate(0deg)':'rotate(180deg)';
}

function onSubSlide(id,cat,subName,value){
  const key=SUBATTR_KEY[subName];
  if(!db[id]) db[id]={};
  db[id][key]=parseInt(value);
  const valEl=document.getElementById('subval-'+key);
  if(valEl) valEl.textContent=value;
  if(subName==='Sprint Speed'){
    const el=document.getElementById('pace-blend-val');
    if(el) el.textContent=subAttrValue(id,'Sprint Speed')??'—';
  }
  refreshCategoryHeader(id,cat);
  updateOVR();
}

function onNameEdit(){
  if(!sel)return;
  if(!db[sel])db[sel]={};
  db[sel].display_name=document.getElementById('name-input').value;
  document.getElementById('card-avatar').textContent=initials(document.getElementById('name-input').value||displayName(sel));
}

function onPosEdit(){
  if(!sel)return;
  if(!db[sel])db[sel]={};
  db[sel].position=document.getElementById('pos-select').value;
  selectPlayer(sel);
}

function onYearEdit(){
  if(!sel)return;
  if(!db[sel])db[sel]={};
  db[sel].year=document.getElementById('year-select').value;
  updateOVR();
}

function onNumEdit(){
  if(!sel)return;
  if(!db[sel])db[sel]={};
  db[sel].jersey_num=parseInt(document.getElementById('num-input').value)||0;
}

function stepAttr(attr,dir){
  if(!sel)return;
  if(!db[sel])db[sel]={};
  const key=attr.toLowerCase();
  const current=db[sel][key]||50;
  const val=Math.min(99,Math.max(1,current+dir));
  db[sel][key]=val;
  document.getElementById(`val-${attr}`).textContent=val;
  const pct=val/99*100;
  const bar=document.getElementById(`bar-${attr}`);
  bar.style.width=pct+'%';
  const isA=attr==='Awareness';
  bar.className=isA?'attr-bar awareness-bar':(val>=90?'attr-bar high':val>=80?'attr-bar good':'attr-bar avg');
  if(isA) updateBlendDisplay(sel);
  updateOVR();
}

function updateOVR(){
  const ovr=calcOVR(sel);
  document.getElementById('card-ovr').textContent=ovr!==null?ovr:'—';
}

async function saveRatings(){
  if(!sel)return;
  const btn=document.getElementById('save-btn');
  btn.disabled=true;btn.textContent='SAVING...';
  const r=db[sel]||{};
  const payload={display_name:document.getElementById('name-input').value||displayName(sel),position:document.getElementById('pos-select').value,year:document.getElementById('year-select').value,jersey_num:parseInt(document.getElementById('num-input').value)||0,awareness:r.awareness||50,diving:r.diving||50,handling:r.handling||50,kicking:r.kicking||50,reflexes:r.reflexes||50,speed:r.speed||50,positioning:r.positioning||50};
  Object.values(SUBATTR_KEY).forEach(k=>{payload[k]=r[k]||50;});
  await dbUpsert(sel,payload);
  btn.disabled=false;btn.textContent='SAVE RATINGS';
  buildPlayerSelect();
  const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);
}

function switchTab(tab,e){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  e.target.classList.add('active');
  document.getElementById('view-'+tab).classList.add('active');
  if(tab==='leaderboard')buildLeaderboard();
  if(tab==='rate'&&unlocked)buildPlayerSelect();
}

async function init(){
  await dbFetch();
  await seedMissingPlayers();
  roster=Object.keys(db);
  await dbFetchQuiz();
  await dbFetchSprints();
  await dbFetchManU();
  await dbFetchTigerEye();
  buildLeaderboard();
}
init();
</script>
</body>
</html>
